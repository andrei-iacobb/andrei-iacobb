    <rect x="0" y="36" width="382" height="210" rx="16" fill="#f6f2e9" fill-opacity="0.92" stroke="#d8d0c4"/>
    <path d="M61 132H191M191 132H321" stroke="#aaa29a" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="61" cy="132" r="17" fill="#d5461a"/>
    <circle cx="191" cy="132" r="17" fill="#f6f2e9" stroke="#ef6a3a" stroke-width="3"/>
    <circle cx="321" cy="132" r="17" fill="#f6f2e9" stroke="#bd765a" stroke-width="3"/>
    <circle cx="61" cy="132" r="4" fill="#f6f2e9"/>
    <circle cx="191" cy="132" r="4" fill="#ef6a3a"/>
    <circle cx="321" cy="132" r="4" fill="#bd765a"/>

    <g fill="#8a837d" font-size="11" font-weight="700" letter-spacing="1.5">
