  <rect x="54" y="55" width="6" height="220" rx="3" fill="url(#accent)"/>
  <text x="92" y="76" fill="#65615d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">SOFTWARE / INFRASTRUCTURE / OPERATIONS</text>
  <text x="88" y="153" fill="#1b1e24" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-2">Andrei Iacob</text>
  <text x="91" y="199" fill="#625e59" font-family="Arial, Helvetica, sans-serif" font-size="21">I build software and run the systems behind it.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">
