<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Andrei Iacob, software developer and systems builder</title>
  <desc id="desc">A light technical banner showing Andrei's build, ship, run approach.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef6a3a"/>
      <stop offset="1" stop-color="#d5461a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d8d0c4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="22" fill="#f6f2e9" stroke="#d8d0c4" stroke-width="2"/>
  <path d="M716 1H1178C1189 1 1199 11 1199 23V307C1199 319 1189 329 1177 329H652Z" fill="#eee8dd"/>
