    <text x="310" y="257" fill="#65615d">SELF-HOSTED INFRA</text>
    <rect x="493" y="236" width="92" height="32" rx="16" fill="#fbf8f2" stroke="#d8d0c4"/>
    <text x="513" y="257" fill="#65615d">MOBILE</text>
  </g>

  <g transform="translate(754 48)" font-family="Arial, Helvetica, sans-serif">
