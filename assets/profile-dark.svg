<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Andrei Iacob, software developer and systems builder</title>
  <desc id="desc">A dark technical banner showing Andrei's build, ship, run approach.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f47a4f"/>
      <stop offset="1" stop-color="#d5461a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#343840" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="22" fill="#11151a" stroke="#343840" stroke-width="2"/>
  <path d="M716 1H1178C1189 1 1199 11 1199 23V307C1199 319 1189 329 1177 329H652Z" fill="#171b21"/>
  <path d="M716 1H1178C1189 1 1199 11 1199 23V307C1199 319 1189 329 1177 329H652Z" fill="url(#grid)" opacity="0.7"/>

  <rect x="54" y="55" width="6" height="220" rx="3" fill="url(#accent)"/>
  <text x="92" y="76" fill="#9ba0a8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">SOFTWARE / INFRASTRUCTURE / OPERATIONS</text>
  <text x="88" y="153" fill="#f5f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-2">Andrei Iacob</text>
  <text x="91" y="199" fill="#c8c3ba" font-family="Arial, Helvetica, sans-serif" font-size="21">I build software and run the systems behind it.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">
