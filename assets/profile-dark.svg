    <rect x="290" y="236" width="192" height="32" rx="16" fill="#191e24" stroke="#343840"/>
    <text x="310" y="257" fill="#9ba0a8">SELF-HOSTED INFRA</text>
    <rect x="493" y="236" width="92" height="32" rx="16" fill="#191e24" stroke="#343840"/>
    <text x="513" y="257" fill="#9ba0a8">MOBILE</text>
  </g>

  <g transform="translate(754 48)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="13" fill="#9ba0a8" font-size="12" font-weight="700" letter-spacing="2.4">FROM IDEA TO UPTIME / 2026</text>
    <rect x="0" y="36" width="382" height="210" rx="16" fill="#11151a" fill-opacity="0.86" stroke="#343840"/>
    <path d="M61 132H191M191 132H321" stroke="#565b63" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="61" cy="132" r="17" fill="#d5461a"/>
    <circle cx="191" cy="132" r="17" fill="#191e24" stroke="#f47a4f" stroke-width="3"/>
    <circle cx="321" cy="132" r="17" fill="#191e24" stroke="#e6a17d" stroke-width="3"/>
    <circle cx="61" cy="132" r="4" fill="#f5f1e8"/>
    <circle cx="191" cy="132" r="4" fill="#f47a4f"/>
    <circle cx="321" cy="132" r="4" fill="#e6a17d"/>

    <g fill="#747982" font-size="11" font-weight="700" letter-spacing="1.5">
